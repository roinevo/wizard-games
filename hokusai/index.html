<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בתוך ההדפס</title>
<style>
:root{--paper:#efe4c9;--paper2:#e4d5b3;--ink:#1c2944;--indigo:#1f3d6d;--red:#b3362b;--muted:#6d5f49}
html,body{margin:0;height:100%;overflow:hidden;background:#d8c8a6;color:var(--ink);font-family:"Frank Ruhl Libre","Noto Serif Hebrew","David",Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;cursor:pointer}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto;background:radial-gradient(ellipse at center,rgba(60,40,15,.15),rgba(40,25,10,.55));z-index:20}
.scr[hidden]{display:none}
.card{position:relative;max-width:820px;width:100%;max-height:100%;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;padding:24px 22px;background:var(--paper);background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 60%),radial-gradient(circle at 80% 90%,rgba(150,110,60,.18),transparent 55%);border:1px solid #a8916a;box-shadow:0 12px 40px rgba(30,20,5,.45),inset 0 0 60px rgba(140,100,50,.18)}
h1{margin:0 0 4px;font-size:clamp(28px,5vw,44px);letter-spacing:.5px;color:var(--ink)}
h1 .seal{display:inline-block;vertical-align:middle;margin-inline-start:10px;background:var(--red);color:#f6ead2;font-size:.45em;padding:.25em .35em;border-radius:3px;font-family:serif;writing-mode:vertical-rl;line-height:1.05;box-shadow:inset 0 0 0 2px rgba(255,240,220,.25)}
.sub{color:var(--muted);margin:0 0 16px;font-size:17px}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.worlds{grid-template-columns:1fr}}
.wcard{background:#f6eedb;border:1px solid #b9a47c;padding:8px;text-align:right;transition:transform .15s,box-shadow .15s;color:inherit}
.wcard:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(40,25,5,.3)}
.wcard img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;border:1px solid #9d8865}
.wcard b{display:block;font-size:19px;margin:8px 0 2px}
.wcard small{color:var(--muted);font-size:14px;display:block;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{background:var(--indigo);color:#f3e9d2;border:0;padding:10px 18px;font-size:17px;box-shadow:0 3px 0 #10203d}
.btn.red{background:var(--red);box-shadow:0 3px 0 #6e1d16}
.btn.ghost{background:transparent;color:var(--indigo);box-shadow:inset 0 0 0 1.5px var(--indigo)}
.help{color:var(--muted);font-size:14px;line-height:1.6;margin-top:12px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.album figure{margin:0;background:#f6eedb;border:1px solid #b9a47c;padding:5px}
.album img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.album figure.no img{filter:grayscale(1) blur(3px) brightness(1.2) opacity(.35)}
.album figcaption{font-size:12.5px;line-height:1.3;margin-top:4px;min-height:2.6em}
.album figure.no figcaption{color:#a3957c}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud[hidden]{display:none}
.cart{position:absolute;top:12px;right:12px;background:#efe3c6;border:1.5px solid #3b3a3a;padding:8px 7px;writing-mode:vertical-rl;font-size:15px;line-height:1.25;box-shadow:2px 3px 0 rgba(0,0,0,.18);color:#2a2a2a}
.cart .jp{font-size:18px;letter-spacing:2px}
.stats{position:absolute;top:12px;right:64px;display:flex;flex-direction:column;gap:5px;font-size:17px}
.stats div{background:rgba(239,227,198,.88);border:1px solid #a8916a;padding:3px 10px;width:max-content}
.goal{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(239,227,198,.92);border:1px solid #a8916a;padding:5px 14px;font-size:17px;max-width:70vw;text-align:center}
#compass{position:absolute;top:52px;left:50%;width:46px;height:46px;margin-left:-23px}
#compass svg{width:100%;height:100%;filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}
#cdist{position:absolute;top:98px;left:50%;transform:translateX(-50%);font-size:13px;color:#2b2b2b;background:rgba(239,227,198,.75);padding:0 6px}
.lives{position:absolute;bottom:14px;right:14px;font-size:22px;letter-spacing:2px;background:rgba(239,227,198,.85);border:1px solid #a8916a;padding:2px 10px}
.boost{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:160px;height:8px;background:rgba(239,227,198,.8);border:1px solid #7d6b4c}
.boost i{display:block;height:100%;background:var(--indigo);width:100%}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:clamp(20px,3.6vw,30px);color:#f7eedb;text-shadow:0 2px 0 #1c2944,0 0 12px rgba(20,30,60,.8);text-align:center;transition:opacity .4s;opacity:0;white-space:pre-line;width:90vw}
.tbtns{position:absolute;top:12px;left:12px;display:flex;gap:6px;pointer-events:auto}
.tbtns button{width:40px;height:40px;background:rgba(239,227,198,.9);border:1px solid #a8916a;font-size:18px;padding:0}
#touch{position:fixed;inset:0;pointer-events:none;z-index:11}
#touch[hidden]{display:none}
#tBoost{position:absolute;bottom:60px;left:24px;width:84px;height:84px;border-radius:50%;background:rgba(31,61,109,.55);color:#f3e9d2;border:2px solid rgba(255,255,255,.5);font-size:30px;pointer-events:auto}
#stickBase{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(31,61,109,.5);background:rgba(239,227,198,.25)}
#stickKnob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(31,61,109,.6)}
.endimg{width:100%;max-height:46vh;object-fit:contain;display:block;margin:4px 0 10px;border:1px solid #9d8865;background:#f6eedb}
.credit{font-size:12px;color:#8a7b62;margin-top:12px}
</style>
</head>
<body>
<div id="hud" hidden>
  <div class="cart"><span class="jp" id="cartJp"></span><span id="cartHe"></span></div>
  <div class="stats"><div id="sSeals"></div><div id="sScrolls"></div><div id="sScore"></div></div>
  <div class="goal" id="goal"></div>
  <div id="compass"><svg viewBox="-24 -24 48 48"><path d="M0,-20 C5,-8 9,2 6,14 C3,8 -3,8 -6,14 C-9,2 -5,-8 0,-20Z" fill="#b3362b" stroke="#2a1d14" stroke-width="1.6"/></svg></div>
  <div id="cdist"></div>
  <div class="lives" id="lives"></div>
  <div class="boost"><i id="boostBar"></i></div>
  <div id="toast"></div>
  <div class="tbtns"><button id="pauseBtn" title="השהיה">❚❚</button><button id="muteBtn" title="צליל">♪</button></div>
</div>
<div id="touch" hidden><div id="stickBase" hidden><div id="stickKnob"></div></div><button id="tBoost">≫</button></div>

<div class="scr" id="startScr">
  <div class="card">
    <h1>בתוך ההדפס<span class="seal">北斎</span></h1>
    <p class="sub">מסע רכוב על עגור אל תוך עולמו של קאצושיקה הוקוסאי. כל ממלכה היא הדפס אמיתי שקם לחיים.</p>
    <div class="worlds" id="worlds"></div>
    <div class="row"><button class="btn ghost" id="albumBtn">📜 אלבום ההדפסים <span id="albumCount"></span></button></div>
    <div class="help" id="helpTxt"></div>
    <div class="credit">ההדפסים: אוסף מוזיאון המטרופוליטן לאמנות, ניו יורק, ברשות הציבור (Open Access, CC0). המוזיקה מקורית.</div>
  </div>
</div>
<div class="scr" id="albumScr" hidden>
  <div class="card">
    <h1 style="font-size:30px">אלבום ההדפסים</h1>
    <p class="sub">כל מגילה שמוצאים בתוך עולם נכנסת לכאן לתמיד.</p>
    <div class="album" id="album"></div>
    <div class="row"><button class="btn" id="albumBack">חזרה</button></div>
  </div>
</div>
<div class="scr" id="pauseScr" hidden>
  <div class="card" style="max-width:380px;text-align:center">
    <h1 style="font-size:30px">הפסקה</h1>
    <div class="row" style="justify-content:center"><button class="btn" id="resumeBtn">להמשיך</button><button class="btn ghost" id="quitBtn">לתפריט</button></div>
  </div>
</div>
<div class="scr" id="endScr" hidden style="background:rgba(40,25,10,.35)">
  <div class="card" style="max-width:640px">
    <h1 style="font-size:30px" id="endTitle"></h1>
    <img class="endimg" id="endImg" alt="">
    <div id="endText" style="font-size:17px;line-height:1.7"></div>
    <div class="row"><button class="btn red" id="nextBtn">לממלכה הבאה</button><button class="btn" id="againBtn">שוב</button><button class="btn ghost" id="menuBtn">לתפריט</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rand = (a, b) => a + Math.random() * (b - a), lerp = (a, b, t) => a + (b - a) * t;
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const smooth = t => t * t * (3 - 2 * t);
const isTouch = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const HASH = location.hash;
const BOT = /^#bot/.test(HASH);

/* ---------------- prints ---------------- */
const PRINTS = {
  45434: "הגל הגדול מול קנגאווה", 36490: "רוח דרומית, שמיים בהירים (פוג'י האדום)", 36492: "סערה למרגלות הפסגה",
  56727: "הדייג על הסלע בקג'יקאזאווה", 36500: "החבתן בפוג'ימיגהרה", 56216: "מפרץ נובוטו", 56132: "סירה בערפל, אושיבורי",
  36498: "אגם הקונה", 36496: "חוף שיצ'יריגהאמה", 54868: "השתקפות באגם מיסאקה", 56786: "מעבר מישימה",
  56240: "אגם סווה", 55741: "האי צוקודה", 55236: "פוג'י מקנאיה", 55458: "הודוגאיה בדרך הטוקאידו",
  55237: "הגשר ניהונבאשי באדו", 53787: "גשר הסירות בסאנו", 56142: "המפל שבו יושיצונה רחץ את סוסו",
  36484: "מפל רובן באויאמה", 37362: "שקיעה מעל גשר ריוגוקו", 44981: "שלג על נהר סומידה", 56138: "פריחת הדובדבן ביושינו",
  49934: "ירח ערב באיזומיזאקי", 49935: "גן הבננות בנאקאשימה", 49936: "גדר במבוק בקומה-מורה", 49937: "המעיין הקדוש בג'וגאקו",
  49938: "קול האגם בריונקאי", 49939: "זוהר ערב בג'ונגאי", 49940: "שמי סתיו בצ'וקו", 49941: "אורנים וגלים בריוטו",
  54433: "הציפור המיסטית"
};
const WORLDS = [
  { name: "הגל הגדול", jp: "神奈川沖浪裏", print: 45434, desc: "לגלוש בין טפרי הקצף של הגל המפורסם בעולם",
    scrolls: [56216, 36496, 55741, 37362, 53787, 49941, 49934, 49938, 56132] },
  { name: "פוג'י האדום", jp: "凱風快晴", print: 36490, desc: "לטפס בין ענני הבוקר אל פסגת ההר האדום",
    scrolls: [36500, 36498, 54868, 56786, 56240, 55236, 55458, 55237, 49935] },
  { name: "סערה למרגלות הפסגה", jp: "山下白雨", print: 36492, desc: "לעלות מתוך החושך והברקים אל מעל העננים",
    scrolls: [56727, 56142, 36484, 44981, 56138, 49936, 49937, 49939, 49940, 54433] }
];
const imgURL = id => "img/" + id + ".jpg";
const SAVEKEY = "hokusai-album";
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVEKEY) || "{}"); return { have: s.have || [], best: s.best || [0, 0, 0], done: s.done || [] }; } catch (e) { return { have: [], best: [0, 0, 0], done: [] }; } }
function writeSave(s) { try { localStorage.setItem(SAVEKEY, JSON.stringify(s)); } catch (e) {} }
let SAVE = loadSave();

/* ---------------- renderer + post ---------------- */
const PR = Math.min(window.devicePixelRatio || 1, 1.5);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(PR);
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 1, 5000);
let rt = null;
const NOISE_GLSL = `
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+1.),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
`;
const post = new THREE.ShaderMaterial({
  uniforms: { tC: { value: null }, tD: { value: null }, res: { value: new THREE.Vector2(1, 1) }, near: { value: 1 }, far: { value: 5000 },
    tP: { value: null }, pMix: { value: 0 }, pAsp: { value: 1.5 }, sAsp: { value: 1 }, flash: { value: 0 }, flashCol: { value: new THREE.Color(1, .95, .85) },
    inkAmt: { value: 1 }, time: { value: 0 }, dmg: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `precision highp float; varying vec2 vUv;
  uniform sampler2D tC,tD,tP; uniform vec2 res; uniform float near,far,pMix,pAsp,sAsp,flash,inkAmt,time,dmg; uniform vec3 flashCol;
  ${NOISE_GLSL}
  float W(vec2 uv){float d=texture2D(tD,uv).r; float z=d*2.-1.; float lz=2.*near*far/(far+near-z*(far-near)); return 1./lz;}
  void main(){
    vec2 uv=vUv; vec2 fc=uv*res;
    vec2 wob=(vec2(vn(fc*.045),vn(fc*.045+17.3))-.5)*2.2/res;
    vec3 col=texture2D(tC,uv+wob).rgb;
    vec2 px=1.35/res; vec2 u2=uv+wob*.6;
    float wc=W(u2), wl=W(u2-vec2(px.x,0.)), wr=W(u2+vec2(px.x,0.)), wu=W(u2+vec2(0.,px.y)), wd=W(u2-vec2(0.,px.y));
    float mx=max(max(max(wc,wl),max(wr,wu)),wd);
    float lap=(abs(wl+wr-2.*wc)+abs(wu+wd-2.*wc))/mx;
    float ink=smoothstep(.05,.16,lap);
    ink*=smoothstep(.15,.55,vn(fc*.09)+.35);
    col=mix(col,vec3(.12,.15,.24),ink*.88*inkAmt);
    // paper
    float pf=fbm(fc*.02)*.35+vn(vec2(fc.x*.08,fc.y*.6))*.25+vn(vec2(fc.x*.6,fc.y*.07))*.22+h21(fc)*.18;
    float paper=mix(.93,1.035,pf);
    vec3 bgP=vec3(.93,.88,.77)*paper;
    col*=paper;
    float g=dot(col,vec3(.3,.59,.11));
    col=mix(col,vec3(g),.07+.1*fbm(uv*5.));
    col=mix(col,col*vec3(1.04,.99,.88),.55);
    // woodgrain in flat ink
    col*=1.-.035*vn(vec2(uv.x*3.,uv.y*140.+vn(uv*8.)*20.));
    float d=length((uv-.5)*vec2(sAsp,1.)/max(sAsp,1.)*1.6);
    col=mix(col,col*vec3(.78,.66,.5),smoothstep(.55,1.05,d)*.55);
    // the real print
    if(pMix>0.){
      vec2 q=uv-.5; float s=.86; vec2 pu;
      if(sAsp>pAsp) pu=vec2(q.x*sAsp/pAsp,q.y)/s+.5; else pu=vec2(q.x,q.y*pAsp/sAsp)/s+.5;
      vec3 pc=bgP*vec3(1.,.985,.95);
      if(pu.x>0.&&pu.x<1.&&pu.y>0.&&pu.y<1.) pc=texture2D(tP,pu).rgb;
      else { float e=max(max(-pu.x,pu.x-1.),max(-pu.y,pu.y-1.)); pc*=1.-.25*smoothstep(.02,0.,e); }
      float n=fbm(uv*vec2(sAsp,1.)*3.5+3.);
      float m=smoothstep(n-.12,n+.12,pMix*1.5-.25);
      col=mix(col,pc,m);
    }
    col=mix(col,flashCol,flash);
    col=mix(col,vec3(.55,.12,.08),dmg*smoothstep(.3,.9,d));
    gl_FragColor=vec4(col,1.);
  }`,
  depthTest: false, depthWrite: false
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const W = Math.floor(w * PR), H = Math.floor(h * PR);
  if (rt) { rt.depthTexture.dispose(); rt.dispose(); }
  rt = new THREE.WebGLRenderTarget(W, H, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  rt.depthTexture = new THREE.DepthTexture(W, H); rt.depthTexture.type = THREE.UnsignedIntType;
  post.uniforms.tC.value = rt.texture; post.uniforms.tD.value = rt.depthTexture;
  post.uniforms.res.value.set(W, H); post.uniforms.sAsp.value = w / h;
  if (particles) particles.forEach(p => p.mat.uniforms.scale.value = H / 2);
}
let particles = null;

/* ---------------- shared materials & textures ---------------- */
const gradMap = (() => { const t = new THREE.DataTexture(new Uint8Array([105, 105, 105, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
const toon = (c, o) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: gradMap }, o || {}));
const FOG = { col: { value: new THREE.Color(0xd8ccb0) }, near: { value: 200 }, far: { value: 1800 } };
const SUN = { value: new V3(-.5, .7, .4).normalize() };
const TIME = { value: 0 };
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.userData = { canvas: c }; return t;
}
const texLoader = new THREE.TextureLoader();
const printTex = {};
function getPrintTex(id) {
  if (!printTex[id]) {
    printTex[id] = texLoader.load(imgURL(id), t => { t.userData = { asp: t.image.width / t.image.height }; });
    printTex[id].userData = { asp: 1.5 };
  }
  return printTex[id];
}
const sealTex = {};
const KANJI = "波富嶽北斎雲雷山風晴龍鶴月花海".split("");
function getSealTex(k) {
  if (sealTex[k]) return sealTex[k];
  return sealTex[k] = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = "#b3362b"; g.beginPath();
    const r = 16; g.moveTo(14 + r, 12); g.lineTo(114 - r, 14); g.quadraticCurveTo(116, 14, 115, 14 + r); g.lineTo(116, 114 - r); g.quadraticCurveTo(115, 116, 114 - r, 115);
    g.lineTo(14 + r, 116); g.quadraticCurveTo(12, 115, 13, 114 - r); g.lineTo(12, 14 + r); g.quadraticCurveTo(13, 12, 14 + r, 12); g.fill();
    g.strokeStyle = "#f3e5c8"; g.lineWidth = 5; g.strokeRect(24, 24, 80, 80);
    g.fillStyle = "#f3e5c8"; g.font = "bold 62px serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(k, 64, 68);
    const id = g.getImageData(0, 0, w, h); for (let i = 0; i < id.data.length; i += 4) if (Math.random() < .07) id.data[i + 3] *= .3; g.putImageData(id, 0, 0);
  });
}
const clawTex = canvasTex(128, 128, (g) => {
  // a fan of foam fingers, each ending in a little hook - Hokusai's "claws"
  const F = [];
  for (let k = 0; k < 5; k++) {
    const a = .25 + k * .3 + Math.random() * .1, len = 62 + Math.random() * 34;
    const ex = 22 + Math.cos(a) * len, ey = 20 + Math.sin(a) * len;

const sfx = {
  seal(n) { if (!AC) return; const t = AC.currentTime; pluck(note(5 + (n % 6)), t, .22, 1.4); pluck(note(9 + (n % 6)), t + .07, .16, 1.6); },
  scroll() { if (!AC) return; const t = AC.currentTime; for (const [m, v] of [[1, .14], [2.76, .07], [5.4, .04]]) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 660 * m; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0005, t + 3); o.connect(g); out(g, .7); o.start(t); o.stop(t + 3.1); } [10, 12, 14].forEach((d, i) => pluck(note(d), t + .15 + i * .12, .12, 1.8)); },
  taiko() { if (!AC) return; const t = AC.currentTime; const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .4); g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .7); o.connect(g); out(g, .3); o.start(t); o.stop(t + .75); noiseHit(t, 300, .7, .25, .4, "lowpass"); },
  splash() { if (!AC) return; noiseHit(AC.currentTime, 1400, .6, .45, .18); },

};

/* ---------------- bot ---------------- */
let stuckT = 0, lastBP = new V3(), wander = 0;
function botStep() {
  keys.left = keys.right = keys.up = keys.down = keys.boost = false; lastKeyT = T;
  let t = curTarget();
  const sc = world.scrolls.find(s => !s.collectedNow && s.pos.distanceTo(P.pos) < 70);
  if (sc && G.phase === "seals") t = sc.pos;
  if (P.pos.distanceTo(lastBP) < .25) stuckT += 1 / 30; else stuckT = 0; lastBP.copy(P.pos);

  if (!t) return;
  const dx = t.x - P.pos.x, dzz = t.z - P.pos.z, dy = t.y - P.pos.y, h = Math.hypot(dx, dzz);
  const diff = wrapA(Math.atan2(dx, dzz) - P.yaw);
  if (diff > .05) keys.left = true; else if (diff < -.05) keys.right = true;
  const want = Math.atan2(dy, Math.max(h, 1)) * 1.4;
  if (want > P.pitch + .05) keys.up = true; else if (want < P.pitch - .05) keys.down = true;
  keys.boost = h > 60 && Math.abs(diff) < .3;
}

/* ---------------- loop ---------------- */
let last = performance.now();
function step(dt) {
  T += dt; TIME.value = T; post.uniforms.time.value = T;
  if (world && world.update) world.update(dt, T);
  if (state === "play") updatePlay(dt);
  else if (state === "intro") {
    G.introT += dt; const k = G.introT;
    post.uniforms.pMix.value = clamp(1 - (k - .8) / 2.4, 0, 1);
    player.position.copy(P.pos); player.rotation.order = "YXZ"; player.rotation.set(0, P.yaw, 0);
    if (k > 3.2) {
      const u = smooth(clamp((k - 3.2) / 2.2, 0, 1));
      const hp = 0; tmp2.set(Math.sin(P.yaw), 0, Math.cos(P.yaw));
      tmp3.copy(P.pos).addScaledVector(tmp2, -11); tmp3.y += 3.4;
      camera.position.lerpVectors(world.camEnd.pos, tmp3, u);
      tmp.copy(world.camEnd.look).lerp(tmp2.copy(P.pos).addScaledVector(P.fwd, 8).add(new V3(0, 1.4, 0)), u);
      camera.lookAt(tmp); camera.fov = lerp(world.camEnd.fov, 62, u); camera.updateProjectionMatrix();
      P.pos.addScaledVector(P.fwd, BASE * dt * u);
    } else { camera.position.copy(world.camEnd.pos); camera.lookAt(world.camEnd.look); }
    if (k > 1.2 && k - dt <= 1.2) toast(WORLDS[worldIdx].name + "\n" + WORLDS[worldIdx].jp, 2.4);
    if (k > 5.4) { state = "play"; G.t0 = T; toast(`אספי ${world.seals.length} חותמות אדומות 🔴`, 2.2); }
  } else if (state === "outro") {
    G.outroT += dt; const u = smooth(clamp(G.outroT / 3.2, 0, 1));
    camera.position.lerpVectors(G.outroFrom.pos, world.camEnd.pos, u);
    const q = new THREE.Quaternion(); const m = new THREE.Matrix4().lookAt(world.camEnd.pos, world.camEnd.look, new V3(0, 1, 0)); q.setFromRotationMatrix(m);
    camera.quaternion.copy(G.outroFrom.q).slerp(q, u);
    camera.fov = lerp(G.outroFrom.fov, world.camEnd.fov, u); camera.updateProjectionMatrix();
    player.position.addScaledVector(P.fwd, BASE * dt);
    post.uniforms.pMix.value = clamp((G.outroT - 3.2) / 2.6, 0, 1);
    if (G.outroT > 8.6 && state === "outro") showEnd();
  } else if (state === "menu") {
    const a = T * .05; camera.position.set(Math.sin(a) * 160 + 40, 30, Math.cos(a) * 160 + 40); camera.lookAt(0, 22, -20);
    if (camera.fov !== 60) { camera.fov = 60; camera.updateProjectionMatrix(); }
  }
  // wing flap + ribbon
  const fl = Math.sin(T * (G && G.boosting ? 11 : 6.5));
  wingL.rotation.z = fl * .55 + .1; wingR.rotation.z = -fl * .55 - .1;
  if (ribbon) { const pa = ribbon.geometry.attributes.position, b = ribbon.userData.base; for (let i = 0; i < pa.count; i++) { const y = b[i * 3 + 1]; pa.setX(i, b[i * 3] + Math.sin(T * 9 + y * 3) * .25 * -y); pa.setZ(i, Math.sin(T * 7 + y * 2.5) * .3 * -y); } pa.needsUpdate = true; }
  for (const s of world.seals) if (!s.got) { s.obj.position.y = s.pos.y + Math.sin(T * 2 + s.pos.x) * .5; s.obj.userData.sprite.material.rotation = Math.sin(T * 1.3 + s.pos.z) * .25; }
  for (const s of world.scrolls) if (s.obj.visible) { s.obj.lookAt(camera.position.x, s.obj.position.y, camera.position.z); s.obj.position.y = s.pos.y + Math.sin(T * .8 + s.pos.x) * 1.2; }
  if (G && G.finalObj) { G.finalObj.rotation.z += dt * .8; G.finalObj.children[0].scale.setScalar(1 + Math.sin(T * 4) * .05); }

}
function render() {

  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
function frame(now) {

addEventListener("resize", resize);

/* ---------------- test hooks ---------------- */
