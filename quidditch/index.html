<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0}</style>
</head>
<body>
<title>גביע הקווידיץ'</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Varela+Round&display=swap">
<style>
/* layout: full-bleed WebGL arena, glassy HUD pills on top, centered dark cards for menus */
:root{
  --night:#070918; --ink:#f6f1ff; --soft:#c9c0ee; --gold:#ffd977; --panel:rgba(14,12,40,.62);
  --line:rgba(255,217,119,.32); --green:#7dffb0; --danger:#ff4d6d;
  --display:"Suez One","Varela Round",Georgia,serif; --body:"Varela Round",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stats{display:flex;flex-direction:column;gap:2px;font-size:15px;font-variant-numeric:tabular-nums;min-width:120px}
.hearts{font-size:17px;letter-spacing:1px;min-height:22px}
#score{font-family:var(--display);color:var(--gold);font-size:19px;display:inline-block;transition:transform .15s}
#score.bump{transform:scale(1.25)}
#panel{text-align:center;min-width:210px;transition:border-color .3s,box-shadow .3s}
#panel.ready{border-color:var(--green);box-shadow:0 0 22px rgba(125,255,176,.35)}
.pname{font-family:var(--display);color:var(--gold);font-size:16px}
.pform{font-size:13px;color:var(--soft);direction:ltr;unicode-bidi:isolate}
.phint{font-size:13px;color:var(--green)}
.pbig{font-family:var(--display);font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.psub{font-size:13px;color:var(--soft)}
.chips{display:flex;gap:6px;justify-content:center;margin-top:6px;direction:ltr;flex-wrap:wrap}
.chip{padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.08);font-size:14px;border:1px solid transparent;font-variant-numeric:tabular-nums}
.chip b{color:var(--c)}
.chip.done{border-color:var(--green);color:var(--green)}
.btns{display:flex;gap:6px}
.icon-btn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
.icon-btn:focus-visible,.go:focus-visible,.act:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch}
.gauge{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--soft);min-width:140px}
.meter{height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;width:100%;border-radius:6px}
#boostBar{background:linear-gradient(90deg,#7ad7ff,#d6f6ff)}
#actBar{background:linear-gradient(90deg,#b9c8ff,#ffffff)}
.act{pointer-events:auto;cursor:pointer;color:var(--soft);font:inherit;text-align:right}
.act.ok{color:#fff;border-color:#cfe0ff;box-shadow:0 0 16px rgba(200,220,255,.35)}
#toast{position:absolute;top:31%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(19px,3.8vw,32px);
  color:var(--gold);text-shadow:0 0 18px rgba(255,190,80,.6),0 2px 6px rgba(0,0,0,.7);opacity:0;transition:opacity .3s;text-align:center;width:min(92vw,720px)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 42%,rgba(150,0,30,.8));opacity:0}
#flash{position:fixed;inset:0;pointer-events:none;z-index:1;background:rgba(255,40,70,.45);opacity:0}
.screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;overflow:auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(5,6,20,.15),rgba(5,6,20,.78))}
.card{max-width:470px;width:100%;background:rgba(18,15,48,.86);border:1px solid var(--line);border-radius:26px;padding:24px 22px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
h1{font-family:var(--display);font-weight:400;color:var(--gold);font-size:clamp(34px,8vw,50px);margin:0;line-height:1.15;text-shadow:0 0 26px rgba(255,200,80,.45);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:clamp(24px,6vw,32px);margin:0 0 8px;text-wrap:balance}
.sub{color:var(--soft);margin:6px 0 0;line-height:1.6}
.howto{text-align:right;color:var(--soft);line-height:1.65;font-size:15px;margin:16px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.howto b{color:var(--ink);font-weight:400}
.keys{font-size:13px;color:var(--soft);background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;line-height:1.7}
label{display:block;margin-top:14px;color:var(--soft);font-size:14px}
#nameIn{margin-top:6px;width:100%;max-width:260px;font:inherit;font-size:17px;text-align:center;color:var(--ink);background:rgba(255,255,255,.07);
  border:1px solid var(--line);border-radius:12px;padding:9px 12px}
#nameIn:focus{outline:2px solid var(--gold)}
.go{font-family:var(--display);font-size:21px;background:linear-gradient(#ffe7a6,#f0b447);color:#2a1a00;border:0;border-radius:16px;
  padding:12px 30px;cursor:pointer;margin-top:16px;box-shadow:0 6px 24px rgba(240,180,71,.35)}
.go:hover{filter:brightness(1.07)}
.best{margin-top:12px;color:var(--soft);font-size:14px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0;font-variant-numeric:tabular-nums}
.statgrid div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px}
.statgrid b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold)}
.statgrid span{font-size:13px;color:var(--soft)}
.rank{font-family:var(--display);font-size:20px;color:#fff}
.home{display:inline-block;margin-top:12px;color:var(--soft);font-size:14px}
#touch{position:fixed;inset:0;pointer-events:none;z-index:3}
#stickBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05)}
#stickKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,217,119,.55)}
.tbtn{pointer-events:auto;position:absolute;right:max(18px,env(safe-area-inset-right,0px));width:76px;height:76px;border-radius:50%;
  border:2px solid var(--line);background:var(--panel);color:#fff;font-size:30px}
#tBoost{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#tAct{bottom:calc(172px + env(safe-area-inset-bottom,0px))}
#tBoost.on{background:rgba(122,215,255,.35)}
#nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:18px;color:var(--soft)}
@media (max-width:640px){
  .top{flex-wrap:wrap}
  #panel{order:3;flex-basis:100%;min-width:0;padding:6px 10px}
  .stats{min-width:0}
  .gauge{min-width:110px;font-size:12px}
  .chip{font-size:13px}
}
@media (prefers-reduced-motion:reduce){#score{transition:none}#toast{transition:none}}
</style>

<canvas id="c" aria-label="גביע הקווידיץ'"></canvas>
<div id="vignette"></div><div id="flash"></div>

<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="pill stats">
      <div class="hearts" id="hearts" aria-label="לבבות"></div>
      <div><span id="score">0</span> נק׳ · <span id="levelLabel">שלב</span> <span id="level">1</span></div>
    </div>
    <div class="pill" id="panel"></div>
    <div class="btns">
      <button class="icon-btn" id="muteBtn" aria-label="השתקה">🔊</button>
      <button class="icon-btn" id="pauseBtn" aria-label="הפסקה">⏸</button>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <div class="bottom">
    <div class="pill gauge"><span>🧹 האצה <span class="kb">(Shift)</span></span><div class="meter"><i id="boostBar"></i></div></div>
    <button class="pill gauge act" id="actBtn"><span><span id="actLabel"></span> <span class="kb">(E)</span></span><div class="meter"><i id="actBar"></i></div></button>
  </div>
</div>

<div id="touch" hidden>
  <div id="stickBase" hidden><div id="stickKnob"></div></div>
  <button class="tbtn" id="tAct"></button>
  <button class="tbtn" id="tBoost" aria-label="האצה">🧹</button>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <h1 id="hTitle"></h1>
    <p class="sub" id="hSub"></p>
    <ul class="howto" id="howto"></ul>
    <div class="keys" id="keysHelp"></div>
    <label for="nameIn">איך קוראים לקוסמת?</label>
    <input id="nameIn" maxlength="16" autocomplete="off">
    <div><button class="go" id="startBtn">המריאי! 🧹</button></div>
    <div class="best" id="bestLine"></div>
    <a class="home" href="../" hidden>← לכל המשחקים</a>
  </div>
</div>

<div class="screen" id="pauseScreen" hidden>
  <div class="card">
    <h2>הפסקה קטנה</h2>
    <p class="sub">המטאטא מרחף במקום.</p>
    <button class="go" id="resumeBtn">ממשיכים לעוף</button>
  </div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <h2 id="overTitle"></h2>
    <div class="rank" id="overRank"></div>
    <div class="statgrid" id="statgrid"></div>
    <div class="best" id="oBest"></div>
    <button class="go" id="againBtn">עוד טיסה</button>
    <div><a class="home" href="../" hidden>← לכל המשחקים</a></div>
  </div>
</div>

<div id="nogl" hidden>הדפדפן הזה לא מצליח להריץ תלת ממד (WebGL). נסי בכרום או בספארי מעודכן.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Wizard games shared flight engine (three.js r128). Each arena calls WizGame(A). */
window.WizGame = function (A) {
"use strict";
const $ = id => document.getElementById(id);
const fail = () => { $("nogl").hidden = false; $("startScreen").hidden = true; };
if (!window.THREE) { fail(); return; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
};
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rgb = hex => { const c = new THREE.Color(hex); return { r: c.r, g: c.g, b: c.b }; };
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const isTouch = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const E = { THREE, V3, isTouch, towerCols: [], boxCols: [], arrowTarget: null, arrowColor: 0x4dff8f, danger: 1e9, clamp, rand, smooth, pick, rgb, wrapA, hexA, store };

/* ---------- texts ---------- */
$("hTitle").textContent = A.title; $("hSub").textContent = A.sub;
$("howto").innerHTML = A.howto.map(h => "<li>" + h + "</li>").join("");
$("actLabel").textContent = A.actionIcon + " " + A.actionName;
$("tAct").textContent = A.actionIcon; $("tAct").setAttribute("aria-label", A.actionName);
$("levelLabel").textContent = A.levelLabel || "שלב";
$("keysHelp").textContent = isTouch
  ? `גררי אצבע בצד שמאל של המסך להיגוי · 🧹 האצה · ${A.actionIcon} ${A.actionName}`
  : `חיצים / WASD או העכבר להיגוי · Shift, רווח או לחיצת עכבר להאצה · E: ${A.actionName} · P הפסקה`;
if (isTouch) document.querySelectorAll(".kb").forEach(e => e.hidden = true);
if (/github\.io$/.test(location.hostname)) document.querySelectorAll(".home").forEach(e => e.hidden = false);

/* ---------- renderer ---------- */
const canvas = $("c");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); } catch (e) { fail(); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(A.fog, A.fogDensity);
scene.background = new THREE.Color(A.fog);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, A.far || 2300);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
Object.assign(E, { scene, camera, renderer });

/* ---------- textures ---------- */
function canvasTex(s, draw, h) { const c = document.createElement("canvas"); c.width = s; c.height = h || s; draw(c.getContext("2d"), s, h || s); const t = new THREE.CanvasTexture(c); t.userData = { canvas: c }; return t; }
const glowTex = canvasTex(128, (g, s) => {
  const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.2, "rgba(255,255,255,.6)");
  r.addColorStop(.5, "rgba(255,255,255,.15)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
const smokeTex = canvasTex(128, (g, s) => {
  for (let i = 0; i < 8; i++) {
    const x = s / 2 + rand(-20, 20), y = s / 2 + rand(-14, 14), rr = rand(24, 42);
    const r = g.createRadialGradient(x, y, 0, x, y, rr);
    r.addColorStop(0, "rgba(255,255,255,.5)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, s, s);
  }
});
function glowSprite(color, size, opacity, fog) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: opacity === undefined ? 1 : opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: !!fog }));
  s.scale.set(size, size, 1); return s;
}
Object.assign(E, { canvasTex, glowTex, smokeTex, glowSprite });

/* ---------- sky ---------- */
const moonDir = (A.moonDir || new V3(.3, .34, -1)).clone().normalize();
E.moonDir = moonDir;
let sky = null, stars = null, starMat = null, moon = null, moonGlow = null;
const clouds = [];
if (A.sky) {
  const S = A.sky;
  sky = new THREE.Mesh(new THREE.SphereGeometry(1700, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { md: { value: moonDir }, hor: { value: new THREE.Color(S.hor) }, mid: { value: new THREE.Color(S.mid) }, top: { value: new THREE.Color(S.top) },
      gc: { value: new THREE.Color(S.glow || 0x4d5479) }, band: { value: new THREE.Color(S.band || 0x000000) } },
    vertexShader: "varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
    fragmentShader: "varying vec3 vP;uniform vec3 md;uniform vec3 hor;uniform vec3 mid;uniform vec3 top;uniform vec3 gc;uniform vec3 band;" +
      "void main(){float h=vP.y;vec3 c=mix(hor,mid,smoothstep(0.0,.28,h));c=mix(c,top,smoothstep(.28,.95,h));float m=max(dot(vP,md),0.0);" +
      "c+=gc*pow(m,40.0)+gc*.35*pow(m,6.0);c+=band*(1.0-smoothstep(0.0,.14,abs(h)));gl_FragColor=vec4(c,1.0);}"
  }));
  sky.renderOrder = -10; scene.add(sky);
}
if (A.stars) {
  const NS = A.stars, sp = new Float32Array(NS * 3), ss = new Float32Array(NS), sph = new Float32Array(NS);
  const band = new V3(.35, .55, .75).normalize(), v = new V3();
  for (let i = 0; i < NS; i++) {
    if (i < NS * .62) {
      do { v.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)); } while (v.lengthSq() > 1 || v.lengthSq() < .01);
      v.normalize(); if (v.y < .02) v.y = Math.abs(v.y) * .5 + .02; v.normalize();
    } else {
      v.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)); v.addScaledVector(band, -v.dot(band)).normalize();
      v.addScaledVector(band, (Math.random() + Math.random() + Math.random() - 1.5) * .12).normalize();
      if (v.y < .02) { v.y = Math.abs(v.y) + .02; v.normalize(); }
    }
    v.multiplyScalar(1400); sp[i * 3] = v.x; sp[i * 3 + 1] = v.y; sp[i * 3 + 2] = v.z;
    ss[i] = Math.random() > .985 ? rand(3, 4.5) : (i < NS * .62 ? rand(1, 2.3) : rand(.8, 1.6)); sph[i] = rand(0, 6.28);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(sp, 3)); g.setAttribute("size", new THREE.BufferAttribute(ss, 1)); g.setAttribute("ph", new THREE.BufferAttribute(sph, 1));
  starMat = new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 }, pr: { value: renderer.getPixelRatio() }, op: { value: A.starOpacity || 1 } },
    vertexShader: "attribute float size;attribute float ph;uniform float t;uniform float pr;varying float vA;void main(){vA=.6+.4*sin(t*(.8+fract(ph)*2.0)+ph*7.0);vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*pr*(.85+.25*vA);gl_Position=projectionMatrix*mv;}",
    fragmentShader: "uniform float op;varying float vA;void main(){vec2 p=gl_PointCoord-.5;float d=length(p);float a=1.0-smoothstep(0.0,.5,d);a*=a;gl_FragColor=vec4(vec3(.82,.88,1.0)*a*vA*op,1.0);}",
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  stars = new THREE.Points(g, starMat); stars.frustumCulled = false; scene.add(stars);
}
if (A.moon) {
  const M = A.moon;
  const tex = canvasTex(256, g => {
    const r = g.createRadialGradient(112, 108, 10, 128, 128, 120);
    if (M.sun) { r.addColorStop(0, "#ffffff"); r.addColorStop(.6, "#fff4d8"); r.addColorStop(1, "#ffd9a0"); }
    else { r.addColorStop(0, "#fffbe8"); r.addColorStop(.85, "#ebe5cf"); r.addColorStop(1, "#cfc7ad"); }
    g.beginPath(); g.arc(128, 128, 118, 0, 7); g.fillStyle = r; g.fill();
    if (!M.sun) {
      g.globalAlpha = .13; g.fillStyle = "#6b6a7c";
      [[90, 100, 26], [160, 80, 16], [150, 160, 30], [80, 170, 14], [120, 135, 10], [185, 130, 12]].forEach(([x, y, rr]) => { g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill(); });
    }
  });
  moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: M.color || 0xffffff, transparent: true, depthWrite: false, fog: false }));
  moon.scale.set(M.size || 85, M.size || 85, 1);
  moonGlow = glowSprite(M.glow || 0xa8b8ff, M.glowSize || 540, M.glowOp || .3);
  scene.add(moonGlow, moon);
}
if (A.clouds) {
  for (let i = 0; i < A.clouds.n; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, color: A.clouds.color, transparent: true, opacity: rand(.25, .5), depthWrite: false, fog: false }));
    const sc = rand(220, 380); s.scale.set(sc, sc * .45, 1);
    clouds.push({ s, a: rand(0, 6.28), r: rand(520, 820), y: rand(110, 230), sp: rand(.004, .01) }); scene.add(s);
  }
}
const hemi = A.hemi || [0x5a6ab0, 0x0c0c18, .75];
scene.add(new THREE.HemisphereLight(hemi[0], hemi[1], hemi[2]));
const dl = A.dirLight || [0xc4d0ff, .95];
const dirLight = new THREE.DirectionalLight(dl[0], dl[1]); dirLight.position.copy(moonDir).multiplyScalar(300); scene.add(dirLight);

/* ---------- particles ---------- */
function makeParticles(n, additive) {
  const geo = new THREE.BufferGeometry();

    s.retT = E.rand(1.2, 2.6);
    s.tgt.set(E.rand(-120, 120), E.rand(10, 60), E.rand(-55, 55));
    if (near) s.tgt.copy(s.pos).add(t3.copy(s.pos).sub(P.pos).setY(0).normalize().multiplyScalar(40)).setY(E.rand(10, 60));
    s.retT = near ? .6 : s.retT;
  }
  const want = t3.copy(s.tgt).sub(s.pos).normalize().multiplyScalar(near ? 34 : 26);
  s.vel.lerp(want, Math.min(1, dt * 3));
  s.pos.addScaledVector(s.vel, dt);
  s.pos.x = E.clamp(s.pos.x, -150, 150); s.pos.z = E.clamp(s.pos.z, -70, 70); s.pos.y = E.clamp(s.pos.y, 6, 70);
  s.g.position.copy(s.pos); s.g.lookAt(t2.copy(s.pos).add(s.vel));
  const fl = Math.sin(T * 40) * .9; s.g.userData.wr.rotation.z = fl; s.g.userData.wl.rotation.z = -fl;
  if (Math.random() < dt * 30) E.sparks.spawn(s.pos.x, s.pos.y, s.pos.z, { life: .5, r: 1, g: .85, b: .3, s0: .7, s1: 0 });
  if (playing && s.pos.distanceTo(P.pos) < 3.2) {
    match.me += 150; match.snitch = true; E.addScore(500); E.sfx.win();
    E.burst(s.pos, E.COL.GOLD, 120, 20, 2.4, 1.6); s.g.visible = false; s.on = false;
    E.toast("✨ תפסת את הסניץ'! +150", 2.5);
    setTimeout(finish, 1800);
  }
}

window.WizGame(A);
})();
